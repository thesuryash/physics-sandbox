name: Request Unity license activation file

# One-time bootstrap: run this manually (Actions tab -> this workflow ->
# "Run workflow") to generate the .alf file needed to activate a free
# Unity Personal license for CI. Download the artifact it produces, then
# follow the steps at https://game.ci/docs/github/activation to turn it
# into a .ulf license and store it as the UNITY_LICENSE repo secret.
# Not part of normal CI — the main pipeline (ci.yml) needs UNITY_LICENSE
# to already exist before it can run.

on:
  workflow_dispatch: {}

jobs:
  request-activation-file:
    name: Request activation file
    runs-on: ubuntu-latest
    steps:
      - name: Request manual activation file
        id: getManualLicenseFile
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 2022.3.62f3

      - name: Upload activation file
        uses: actions/upload-artifact@v4
        with:
          name: Unity_v2022.3.62f3.alf
          path: ${{ steps.getManualLicenseFile.outputs.filePath }}
          retention-days: 7
